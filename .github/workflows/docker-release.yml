name: Release Build and Push to Dockerhub

on:
  push:
    tags:
      - "v*.*.*" # triggers on tags like v1.0.0

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    # secrets:
    #   CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Release Push
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    environment: prod

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set metadata
        id: meta
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "VCS_REF=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        # https://github.com/docker/setup-buildx-action/releases/tag/v4.0.0
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Login to Docker Hub
        # https://github.com/docker/login-action/releases/tag/v4.1.0
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image name
        id: repo
        run: echo "REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        # https://github.com/docker/build-push-action/releases/tag/v7.1.0
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.VERSION }}
            VCS_REF=${{ steps.meta.outputs.VCS_REF }}
            BUILD_DATE=${{ steps.meta.outputs.BUILD_DATE }}
          tags: |
            docker.io/${{ steps.repo.outputs.REPO }}:${{ steps.meta.outputs.VERSION }}
            docker.io/${{ steps.repo.outputs.REPO }}:latest

  release:
    name: Create GitHub Release
    runs-on: ubuntu-26.04
    needs: test

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Prepare SHA256 checksum
        run: sha256sum sh-seekarr.sh > SHA256SUMS

      - name: Create GitHub Release
        # https://github.com/softprops/action-gh-release/releases/tag/v3.0.2
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          files: |
            sh-seekarr.sh
            SHA256SUMS

  # Push to github
  push-build-to-github:
    runs-on: ubuntu-latest
    needs: build-and-push 

    if: startsWith(github.ref, 'refs/tags/v')
    environment: prod

    permissions:
      packages: write

    steps:
      - name: Prepare image name
        id: meta
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        # https://github.com/docker/login-action/releases/tag/v4.1.0
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Login to GitHub Container Registry
        # https://github.com/docker/login-action/releases/tag/v4.1.0
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        run: |
          wget https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz -O - | \
            tar -xz crane
          sudo mv crane /usr/local/bin/

      - name: Copy image from Docker Hub to GHCR
        run: |
          crane cp \
            "docker.io/${{ steps.meta.outputs.REPO }}:${{ steps.meta.outputs.VERSION }}" \
            "ghcr.io/${{ steps.meta.outputs.REPO }}:${{ steps.meta.outputs.VERSION }}"

          crane mutate \
            --label org.opencontainers.image.source="https://github.com/${{ steps.meta.outputs.REPO }}" \
            "ghcr.io/${{ steps.meta.outputs.REPO }}:${{ steps.meta.outputs.VERSION }}"

          crane cp \
            "docker.io/${{ steps.meta.outputs.REPO }}:latest" \
            "ghcr.io/${{ steps.meta.outputs.REPO }}:latest"

          crane mutate \
            --label org.opencontainers.image.source="https://github.com/${{ steps.meta.outputs.REPO }}" \
            "ghcr.io/${{ steps.meta.outputs.REPO }}:latest"